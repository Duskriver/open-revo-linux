name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify hardware vault boundary
        run: python3 scripts/check_vault_leaks.py
      - name: Test hardware vault gate
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb dbus-x11
      - run: pnpm install --frozen-lockfile
      - run: pnpm linux:check
      - run: make -C drivers/openrevo-ec test
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -p openrevo-core --all-targets -- -D warnings
      - name: Build native test application
        run: pnpm tauri build --debug --no-bundle
      - name: Install Tauri WebDriver
        run: cargo install tauri-driver --locked
      - name: Test native window
        run: dbus-run-session -- xvfb-run -a python3 tests/linux_webdriver.py
      - name: Build complete Debian package
        run: pnpm linux:build
      - name: Verify complete Debian package
        id: package
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          version = json.loads(Path('src-tauri/tauri.conf.json').read_text())['version']
          package = Path(f'dist_release/OpenRevo_{version}_amd64.deb')
          subprocess.run(['python3', 'packaging/build_linux_package.py', '--verify', str(package)], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'path={package}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openrevo-linux-x86_64
          if-no-files-found: error
          path: ${{ steps.package.outputs.path }}

  kernel:
    name: Kernel module (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic
      - name: Build module without loading hardware
        run: |
          headers=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          test -n "$headers"
          make -C drivers/openrevo-ec KDIR="$headers"
