[package]
name = "open-revo"
version = "0.9.3"
description = "Linux control center for Mechrevo laptops"
license = "GPL-3.0-or-later"
edition = "2021"
default-run = "open-revo"
autobins = false

[lib]
name = "open_revo_lib"
crate-type = ["rlib"]

[workspace]
members = [".", "crates/openrevo-core"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
openrevo-core = { path = "crates/openrevo-core" }
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2.0.0"
tauri-plugin-single-instance = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "open-revo"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
