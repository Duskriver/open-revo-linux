[package]
name = "openrevo-core"
version = "0.9.3"
description = "Linux hardware control and telemetry for Mechrevo laptops"
license = "GPL-3.0-or-later"
edition = "2021"
autobins = false

[lib]
name = "openrevo_core"
crate-type = ["rlib"]

[[bin]]
name = "openrevo-probe"
path = "src/bin/openrevo-probe.rs"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde_json = "1.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
